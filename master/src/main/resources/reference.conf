orchestrix {
  home-dir = "."

  resolver {
    base-dir = "."
    work-dir = ${orchestrix.home-dir}"/resolver"
    resolution-cache-dir = ${orchestrix.resolver.work-dir}"/cache"
    repository-cache-dir = ${orchestrix.resolver.work-dir}"/local"

    repositories = [ ]

    dispatcher {
      type = Dispatcher
      executor = "fork-join-executor"

      fork-join-executor {
        parallelism-min = 2
        parallelism-max = 10
        parallelism-factor = 2.0
      }

      throughput = 10
    }
  }

  http {
    bind-interface = 0.0.0.0
    bind-port = 8095

    request-timeout = 2500ms
  }

  task-queue {
    max-work-timeout = 10m
  }

  api-dispatcher {
    type = Dispatcher
    executor = "fork-join-executor"

    fork-join-executor {
      parallelism-min = 2
      parallelism-max = 10
      parallelism-factor = 2.0
    }

    throughput = 10
  }

  trigger-dispatcher {
    type = Dispatcher
    executor = "thread-pool-executor"

    thread-pool-executor {
      core-pool-size-min = 4
      core-pool-size-max = 10
      core-pool-size-factor = 2.0
    }

    throughput = 10
  }

}

akka {
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  loglevel = "DEBUG"
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"

  extensions = [
    "akka.cluster.client.ClusterClientReceptionist",
    "akka.cluster.metrics.ClusterMetricsExtension"
  ]

  actor {
    provider = "akka.cluster.ClusterActorRefProvider"

    serialization-bindings {
      "io.orchestrix.cluster.registry.PersistentJob$CreateJob"      = kryo
      "io.orchestrix.cluster.scheduler.ExecutionDriver$Initialize"  = kryo
      "io.orchestrix.cluster.scheduler.ExecutionDriver$Initialized" = kryo

      "io.orchestrix.cluster.scheduler.ExecutionLifecycle$Awake"    = kryo
      "io.orchestrix.cluster.scheduler.ExecutionLifecycle$Start$"   = kryo
      "io.orchestrix.cluster.scheduler.ExecutionLifecycle$Finish"   = kryo
      "io.orchestrix.cluster.scheduler.ExecutionLifecycle$Cancel"   = kryo
      "io.orchestrix.cluster.scheduler.ExecutionLifecycle$TimeOut$" = kryo
      "io.orchestrix.cluster.scheduler.ExecutionLifecycle$Get$"     = kryo

      "io.orchestrix.cluster.scheduler.ExecutionLifecycle$Awaken"    = kryo
      "io.orchestrix.cluster.scheduler.ExecutionLifecycle$Cancelled" = kryo
      "io.orchestrix.cluster.scheduler.ExecutionLifecycle$Triggered" = kryo
      "io.orchestrix.cluster.scheduler.ExecutionLifecycle$Started$"  = kryo
      "io.orchestrix.cluster.scheduler.ExecutionLifecycle$Completed" = kryo
      "io.orchestrix.cluster.scheduler.ExecutionLifecycle$TimedOut$" = kryo
      "io.orchestrix.cluster.scheduler.ExecutionLifecycle$Result"    = kryo
    }
  }

  remote {
    log-remote-lifecycle-events = off
    netty.tcp.port = 2551

    trusted-selection-paths = [
      "/user/orchestrix"
    ]
  }

  cluster {
    roles = ["registry", "scheduler"]

    seed-nodes = [ ]

    auto-down-unreachable-after = 10s
  }

  persistence {
    journal.plugin = "cassandra-journal"
    snapshot-store.plugin = "cassandra-snapshot-store"
  }

  sharding {
    state-store-mode = "persistence"

    journal-plugin-id = "cassandra-journal"
    snapshot-plugin-id = "cassandra-snapshot-store"
  }
}

cassandra-journal {
  keyspace = "orchestrix"

  tags {
    registry       = 1
    task           = 1
    execution-plan = 2
  }

  event-adapters {
    registry-tag  = "io.orchestrix.cluster.registry.RegistryTagEventAdapter"
    scheduler-tag = "io.orchestrix.cluster.scheduler.SchedulerTagEventAdapter"
  }

  event-adapter-bindings {
    "io.orchestrix.protocol.registry.JobAccepted" = registry-tag
    "io.orchestrix.protocol.registry.JobRejected" = registry-tag
    "io.orchestrix.protocol.registry.JobEnabled"  = registry-tag
    "io.orchestrix.protocol.registry.JobDisabled" = registry-tag

    "io.orchestrix.protocol.scheduler.SchedulerEvent"        = scheduler-tag
    "io.orchestrix.protocol.scheduler.ExecutionPlanStarted"  = scheduler-tag
    "io.orchestrix.protocol.scheduler.ExecutionPlanFinished" = scheduler-tag
    "io.orchestrix.protocol.scheduler.TaskScheduled"         = scheduler-tag
    "io.orchestrix.protocol.scheduler.TaskTriggered"         = scheduler-tag
    "io.orchestrix.protocol.scheduler.TaskCompleted"         = scheduler-tag

    "io.orchestrix.cluster.scheduler.ExecutionDriver$Initialized" = scheduler-tag
  }

}

cassandra-snapshot-store {
  keyspace = "orchestrix_snapshot"
}

kamon.util.filters {
  "akka.tracked-actor" {
    includes = [ "OrchestrixClusterSystem/user/orchestrix/**" ]
  }

  "akka.tracked-dispatcher" {
    includes = [
      "OrchestrixClusterSystem/akka.actor.default-dispatcher",
      "OrchestrixClusterSystem/orchestrix.resolver.dispatcher",
      "OrchestrixClusterSystem/orchestrix.api-dispatcher",
      "OrchestrixClusterSystem/orchestrix.trigger-dispatcher"
    ]
  }

  "akka.traced-actor" {
    includes = [ "**" ]
  }
}