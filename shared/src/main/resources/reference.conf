akka {
  log-dead-letters-during-shutdown = off

  actor {
    allow-java-serialization = off
    serializers {
      kryo = "com.twitter.chill.akka.AkkaSerializer"
    }

    serialization-bindings {
      "io.orchestrix.JobId"         = kryo
      "io.orchestrix.PlanId"        = kryo
      "io.orchestrix.TaskId"        = kryo
      "io.orchestrix.NodeId"        = kryo
      "io.orchestrix.Task"          = kryo
      "io.orchestrix.ExecutionPlan" = kryo
      "io.orchestrix.JobNotFound"   = kryo
      "io.orchestrix.JobNotEnabled" = kryo

      "io.orchestrix.protocol.client.ClientCommand" = kryo
      "io.orchestrix.protocol.client.ClientEvent" = kryo

      // Registry messages/events
      "io.orchestrix.protocol.registry.RegistryCommand" = kryo
      "io.orchestrix.protocol.registry.RegistryEvent"   = kryo
      "io.orchestrix.protocol.registry.RegisterJob"     = kryo
      "io.orchestrix.protocol.registry.GetJob"          = kryo
      "io.orchestrix.protocol.registry.JobAccepted"     = kryo
      "io.orchestrix.protocol.registry.JobRejected"     = kryo
      "io.orchestrix.protocol.registry.DisableJob"      = kryo
      "io.orchestrix.protocol.registry.JobDisabled"     = kryo
      "io.orchestrix.protocol.registry.EnableJob"       = kryo
      "io.orchestrix.protocol.registry.JobEnabled"      = kryo

      "io.orchestrix.protocol.scheduler.SchedulerCommand"       = kryo
      "io.orchestrix.protocol.scheduler.SchedulerEvent"         = kryo
      "io.orchestrix.protocol.scheduler.ExecutionPlanStarted"   = kryo
      "io.orchestrix.protocol.scheduler.ExecutionPlanFinished"  = kryo
      "io.orchestrix.protocol.scheduler.ExecutionPlanCancelled" = kryo
      "io.orchestrix.protocol.scheduler.TaskScheduled"          = kryo
      "io.orchestrix.protocol.scheduler.TaskTriggered"          = kryo
      "io.orchestrix.protocol.scheduler.TaskCompleted"          = kryo
      "io.orchestrix.protocol.scheduler.JobFailedToSchedule"    = kryo
      "io.orchestrix.protocol.scheduler.GetExecutionPlan"       = kryo
      "io.orchestrix.protocol.scheduler.GetExecutionPlans"      = kryo
      "io.orchestrix.protocol.scheduler.CancelExecutionPlan"    = kryo
      "io.orchestrix.protocol.scheduler.TaskQueueUpdated"       = kryo

      "io.orchestrix.protocol.worker.WorkerJoined"  = kryo
      "io.orchestrix.protocol.worker.WorkerLost"    = kryo
      "io.orchestrix.protocol.worker.WorkerRemoved" = kryo

      "io.orchestrix.protocol.client.Connect$"      = kryo
      "io.orchestrix.protocol.client.Connected$"    = kryo
      "io.orchestrix.protocol.client.Disconnect$"   = kryo
      "io.orchestrix.protocol.client.Disconnected$" = kryo

      "io.orchestrix.protocol.cluster.MasterReachable"   = kryo
      "io.orchestrix.protocol.cluster.MasterUnreachable" = kryo
      "io.orchestrix.protocol.cluster.MasterJoined"      = kryo
      "io.orchestrix.protocol.cluster.MasterRemoved"     = kryo
      "io.orchestrix.protocol.cluster.GetClusterStatus$" = kryo

      "io.orchestrix.cluster.protocol.MasterMessage"  = kryo
      "io.orchestrix.cluster.protocol.WorkerMessage"  = kryo
      "io.orchestrix.cluster.protocol.RegisterWorker" = kryo
      "io.orchestrix.cluster.protocol.RequestTask"    = kryo
      "io.orchestrix.cluster.protocol.TaskDone"       = kryo
      "io.orchestrix.cluster.protocol.TaskFailed"     = kryo
      "io.orchestrix.cluster.protocol.TaskReady$"     = kryo
      "io.orchestrix.cluster.protocol.TaskDoneAck"    = kryo
    }
  }
}

kamon {

  internal-config {
    akka {
      actor.provider = ${akka.actor.provider}
      remote.netty.tcp.port = 3551
    }
  }

}